<head>
  <title>Persistent Notes</title>
  <link rel="icon" href="../chaos.png">
</head>
<body contenteditable=true></body>
<script>
const body = document.body;

const setTitle = () => {
document.title = (body.innerText.split(/\r?\n/)[0] || "").trim() || "Persistent Notes";
}

/* Hope this doesn't allow XSS */
body.innerHTML = decodeURIComponent(location.search).substring(1) || "Take Notes...";
setTitle();

const saveInput = () => {
const url = new URL(location.href);
url.search = encodeURIComponent(body.innerHTML);
setTitle();
window.history.replaceState({}, document.title, url);
}

let saveTimeout;

body.oninput = () => {
clearTimeout(saveTimeout);
saveTimeout = setTimeout(saveInput, 500);
}
</script>
